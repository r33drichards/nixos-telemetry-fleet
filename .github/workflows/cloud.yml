name: Approved Azure host orchestration
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [oidc-check, image-auth-check, image-transport, image-import, plan, apply, amd-plan, amd-apply, e2e]
        required: true
      oidc_environment:
        description: Identity to verify (oidc-check only)
        type: choice
        options: [fleet-plan, fleet-apply]
        default: fleet-plan
      import_node:
        description: Architecture selection (image-import only; must match private plan)
        type: choice
        options: [both, node2, node3]
        default: both
      approved_image_transport_plan_sha256:
        description: Exact privately reviewed image transport plan hash (image-transport only)
        type: string
      approved_image_import_plan_sha256:
        description: Exact privately reviewed import payload and artifact checksums (image-import only)
        type: string
      plan_run_id:
        description: Prior plan run ID (apply only)
        type: string
      approved_plan_sha256:
        description: Exact privately reviewed saved-plan hash (apply only)
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ startsWith(inputs.operation, 'amd-') && 'fleet-amd-state' || 'fleet-cloud-state' }}
  cancel-in-progress: false
jobs:
  oidc-check:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'oidc-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.oidc_environment }}
    permissions:
      contents: read
      id-token: write
    env:
      OIDC_CHECK_ENABLED: ${{ vars.OIDC_CHECK_ENABLED }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FLEET_RESOURCE_GROUP: ${{ vars.FLEET_RESOURCE_GROUP }}
    steps:
      - name: Require approved federation setup
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$OIDC_CHECK_ENABLED" = explicitly-approved
          test -n "$FLEET_RESOURCE_GROUP"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          audience: api://AzureADTokenExchange
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify account and read fleet RG only
        run: python3 scripts/azure-oidc-check.py
  image-auth-check:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'image-auth-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: fleet-apply
    permissions:
      contents: read
      id-token: write
    env:
      OIDC_CHECK_ENABLED: ${{ vars.OIDC_CHECK_ENABLED }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FLEET_RESOURCE_GROUP: ${{ vars.FLEET_RESOURCE_GROUP }}
    steps:
      - name: Require approved federation setup
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$OIDC_CHECK_ENABLED" = explicitly-approved
          test -n "$FLEET_RESOURCE_GROUP"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          audience: api://AzureADTokenExchange
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read-only storage and disk audience probe
        run: |
          python3 scripts/azure-oidc-check.py
          python3 scripts/image-auth-check.py
  terraform:
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'plan' || inputs.operation == 'apply' || inputs.operation == 'amd-plan' || inputs.operation == 'amd-apply')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ (inputs.operation == 'apply' || inputs.operation == 'amd-apply') && 'fleet-apply' || 'fleet-plan' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      OPERATION: ${{ (inputs.operation == 'apply' || inputs.operation == 'amd-apply') && 'apply' || 'plan' }}
      TF_ROOT: ${{ startsWith(inputs.operation, 'amd-') && 'terraform/amd-canary' || 'terraform' }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      FLEET_ENABLED: ${{ vars[startsWith(inputs.operation, 'amd-') && 'AMD_CANARY_ENABLED' || 'FLEET_ENABLED'] }}
      BACKEND_CONFIG: ${{ secrets[startsWith(inputs.operation, 'amd-') && 'AMD_BACKEND_CONFIG' || 'TF_BACKEND_CONFIG'] }}
      TOPOLOGY: ${{ secrets[startsWith(inputs.operation, 'amd-') && 'AMD_TOPOLOGY_JSON' || 'TF_TOPOLOGY_JSON'] }}
      PLAN_STORAGE_ACCOUNT: ${{ secrets.PLAN_STORAGE_ACCOUNT }}
      PLAN_CONTAINER: ${{ secrets.PLAN_CONTAINER }}
    steps:
      - name: Require approved main revision and environment setup
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$FLEET_ENABLED" = explicitly-approved
          test -n "$BACKEND_CONFIG" && test -n "$ARM_CLIENT_ID"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          audience: api://AzureADTokenExchange
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Plan privately or apply exact approved plan
        run: bash scripts/cloud-terraform.sh
  cloud-e2e:
    if: inputs.operation == 'e2e'
    environment: fleet-e2e
    # Dedicated ephemeral runner with approved private reachability; never PR code.
    runs-on: [self-hosted, fleet-e2e]
    timeout-minutes: 15
    env:
      FLEET_ENABLED: ${{ vars.FLEET_ENABLED }}
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main && test "$FLEET_ENABLED" = explicitly-approved
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/cloud-e2e.py /run/fleet/inventory.json

  image-transport:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'image-transport'
    environment: fleet-apply
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            node: node2
            efi: BOOTX64.EFI
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            node: node3
            efi: BOOTAA64.EFI
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TRANSPORT_ENABLED: ${{ vars.IMAGE_TRANSPORT_ENABLED }}
      APPROVED_IMAGE_TRANSPORT_PLAN_SHA256: ${{ inputs.approved_image_transport_plan_sha256 }}
      PRIVATE_IMAGE_TRANSPORT_PLAN: ${{ secrets.IMAGE_TRANSPORT_PLAN_JSON }}
      OIDC_CHECK_ENABLED: ${{ vars.OIDC_CHECK_ENABLED }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FLEET_RESOURCE_GROUP: ${{ vars.FLEET_RESOURCE_GROUP }}
      EXPECTED_NODE: ${{ matrix.node }}
      EXPECTED_SYSTEM: ${{ matrix.system }}
      EXPECTED_EFI: ${{ matrix.efi }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: tooling
      - name: Validate explicit private transport approval before login
        run: |
          umask 077
          python3 - <<'PYCODE'
          import os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'fleet-image-transport.json').write_text(os.environ['PRIVATE_IMAGE_TRANSPORT_PLAN'])
          PYCODE
          python3 tooling/scripts/transport-image.py "$RUNNER_TEMP/fleet-image-transport.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ba51125b3d367b8326b357023a5ad5812239b7a9
          path: image-source
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771
        with:
          install_url: https://releases.nixos.org/nix/nix-2.30.2/install
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Rebuild verified source and inspect actual artifact
        working-directory: image-source
        run: |
          test "$(git rev-parse HEAD)" = ba51125b3d367b8326b357023a5ad5812239b7a9
          nix build -L ".#packages.$EXPECTED_SYSTEM.azure-$EXPECTED_NODE" --out-link result
          bash ../tooling/scripts/inspect-vhd.sh
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          audience: api://AzureADTokenExchange
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify existing Reader scope and retain private rebuilt image
        working-directory: image-source
        run: |
          python3 ../tooling/scripts/azure-oidc-check.py
          vhd=$(find -L result -maxdepth 1 -name '*.vhd' -print)
          python3 ../tooling/scripts/transport-image.py "$RUNNER_TEMP/fleet-image-transport.json" --node "$EXPECTED_NODE" --vhd "$vhd" --report image-report.json --upload
      - name: Remove local private plan
        if: always()
        run: rm -f "$RUNNER_TEMP/fleet-image-transport.json"

  image-import:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'image-import'
    environment: fleet-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ${{ inputs.import_node == 'node2' && fromJSON('["node2"]') || inputs.import_node == 'node3' && fromJSON('["node3"]') || fromJSON('["node2","node3"]') }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_IMPORT_ENABLED: ${{ vars.IMAGE_IMPORT_ENABLED }}
      APPROVED_IMAGE_IMPORT_PLAN_SHA256: ${{ inputs.approved_image_import_plan_sha256 }}
      PRIVATE_IMAGE_IMPORT_PLAN: ${{ secrets.IMAGE_IMPORT_PLAN_JSON }}
      OIDC_CHECK_ENABLED: ${{ vars.OIDC_CHECK_ENABLED }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FLEET_RESOURCE_GROUP: ${{ vars.FLEET_RESOURCE_GROUP }}
      IMPORT_NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate private import plan before login
        run: |
          umask 077
          python3 - <<'PYCODE'
          import os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'fleet-image-import.json').write_text(os.environ['PRIVATE_IMAGE_IMPORT_PLAN'])
          PYCODE
          python3 scripts/import-image.py "$RUNNER_TEMP/fleet-image-import.json" --node "$IMPORT_NODE"
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771
        with:
          install_url: https://releases.nixos.org/nix/nix-2.30.2/install
      - name: Install AzCopy from pinned Nixpkgs
        run: |
          nix build --out-link azcopy-tool github:NixOS/nixpkgs/da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36#azure-storage-azcopy
          ./azcopy-tool/bin/azure-storage-azcopy --version
          echo "$PWD/azcopy-tool/bin" >> "$GITHUB_PATH"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          audience: api://AzureADTokenExchange
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Import approved artifacts and clean verified staging only
        run: |
          python3 scripts/azure-oidc-check.py
          python3 scripts/import-image.py "$RUNNER_TEMP/fleet-image-import.json" --node "$IMPORT_NODE" --execute
      - name: Remove local private plan
        if: always()
        run: rm -f "$RUNNER_TEMP/fleet-image-import.json"
